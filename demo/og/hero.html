<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smooth Shadow Plugin — README hero</title>
    <!--
      Source for demo/public/images/hero.webp. Rendered headless at exactly
      1200x420 by ./render.sh — edit here, re-run that, never touch the .webp.

      One panel wearing smooth-shadow-ring-xl on a transparent ground, so the
      README picks up whichever background GitHub is using.

      Why a white panel still works on GitHub's dark theme: the card reads as a
      card either way — on white it is defined by the shadow halo and the ring,
      on dark by its own brightness. The shadow itself only shows on the light
      theme, which is the honest limit of a single alpha export; a dark twin
      behind <picture> is the fix if that ever matters more than one file does.

      Values are verbatim smooth-shadow-ring-xl from src/shadow-ring.css.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 1200px;
        height: 420px;
        background: transparent;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .panel {
        width: 780px;
        height: 236px;
        border-radius: 32px;
        background: #fff;
        box-shadow:
          0 40px 80px 0 rgba(0, 0, 0, 0.06),
          0 20px 40px 0 rgba(0, 0, 0, 0.05),
          0 10px 20px 0 rgba(0, 0, 0, 0.04),
          0 5px 10px 0 rgba(0, 0, 0, 0.03),
          0 2px 4px 0 rgba(0, 0, 0, 0.02),
          /* The plugin's own hairline is rgba(0,0,0,0.05). Nudged to 0.08 so it
             still separates the panel from a pure-white README once the image
             has been scaled down in a browser. */
          0 0 0 1.5px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="panel"></div>
  </body>
</html>
